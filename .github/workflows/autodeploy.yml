name: Build and Deploy

on: 
  push:
    branches: [ "main" ]

jobs:
  job_1:
    name: build_docker_image
    runs-on: ubuntu-latest
    steps:
      # clone the repo 
      - name: cloning the repo 
        uses: actions/checkout@v4

      # login to docker hub 
      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # build the image 
      - name: tag and build the image
        run: |
          docker build --platform linux/amd64 -t frontend -f docker/Dockerfile.frontend .
          docker build --platform linux/amd64 -t backend -f docker/Dockerfile.httpserver .

      # tagging the image for pushing to docker hub 
      - name: tag image 
        run: |
          docker tag frontend ${{ secrets.DOCKER_USERNAME }}/frontend
          docker tag backend ${{ secrets.DOCKER_USERNAME }}/backend

      - name: push to docker hub 
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/backend
    
  job_2:
    needs: [job_1]
    name: starting container inside the vm 
    runs-on: ubuntu-latest
    steps: 
      # ssh into the machine 
      - name: logging into the machine and deploy
        run: | 
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 400 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@100.24.16.37  "
            if [ -d 'auto-deploy_vm' ]; then
              cd auto-deploy_vm && git pull
            else
              git clone https://github.com/BilsoNyuMNAM/auto-deploy_vm.git
              cd auto-deploy_vm
            fi
            
           
            docker compose pull
            
            docker compose up -d db
            
            docker compose run --rm backend npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
            

            docker compose up -d
          "
