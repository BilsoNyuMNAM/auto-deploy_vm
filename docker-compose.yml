services:
  frontend:
    image: dfsdds/frontend

    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
     image: dfsdds/backend
    environment:
      DATABASE_URL: "postgresql://postgres:mysecretpassword@db:5432/postgres?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    
